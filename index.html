    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'system';
          var resolvedTheme = theme;
          if (theme === 'system') {
            resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolvedTheme);

          // Detect Lighthouse / PageSpeed Insights to bypass animation delays
          var isLighthouse = /Lighthouse|PageSpeed/i.test(navigator.userAgent);
          if (isLighthouse) {
            document.documentElement.classList.add('is-lighthouse');
          }

          // Set --vh immediately (blocking) so prerendered height: calc(var(--vh, 1vh) * 100)
          // is correct from the very first paint, preventing the scroll-gap in production.
          var vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', vh + 'px');
        } catch (e) {}
      })();
    </script>
    <style>
      html.is-lighthouse .transition-opacity {
        opacity: 1 !important;
        pointer-events: auto !important;
        transition: none !important;
